<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flowboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* 색 · 글꼴 · 칸 모양 · 연결 강조는 Archify(MIT, © 2026 tt-a1i, © 2025 Cocoon AI)의 방식을 따랐습니다. */
:root {
  --bg: #020617; --panel: #0f172a; --panel-2: #111c33; --line: #1e293b; --lane: #334155;
  --text: #f8fafc; --muted: #94a3b8; --faint: #7d8da1; --arrow: #64748b; --emph: #34d399; --accent: #38bdf8; --danger: #fb7185; --warn: #fbbf24;
  --frontend: #22d3ee; --backend: #34d399; --database: #a78bfa; --cloud: #fbbf24; --security: #fb7185; --messagebus: #fb923c; --external: #94a3b8;
  --human: #fb923c; --script: #94a3b8; --agent: #a78bfa; --service: #22d3ee;
  --tint: 12%; --mono: "JetBrains Mono", "Apple SD Gothic Neo", ui-monospace, Menlo, monospace;
}
:root[data-theme="light"] {
  --bg: #f8fafc; --panel: #ffffff; --panel-2: #f1f5f9; --line: #e2e8f0; --lane: #cbd5e1;
  --text: #0f172a; --muted: #64748b; --faint: #64748b; --arrow: #94a3b8; --emph: #059669; --accent: #0369a1; --danger: #e11d48; --warn: #b45309;
  --frontend: #0891b2; --backend: #059669; --database: #7c3aed; --cloud: #d97706; --security: #e11d48; --messagebus: #ea580c; --external: #64748b;
  --human: #ea580c; --script: #64748b; --agent: #7c3aed; --service: #0891b2; --tint: 8%;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--mono); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* 상단 탭 */
.apptabs { position: sticky; top: 0; z-index: 6; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; align-items: stretch; gap: 2px; padding: 0 20px; }
.apptabs .brand { font-weight: 700; color: var(--faint); align-self: center; margin-right: 16px; }
.apptab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 14px 16px 11px; font-size: 15px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 50px; white-space: nowrap; }
.apptab:hover { color: var(--text); }
.apptab[aria-selected="true"] { color: var(--text); border-color: var(--emph); }
.apptabs .grow { flex: 1; }
.theme-btn { align-self: center; }

.bar { position: sticky; top: 50px; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 20px; }
.bar h1 { font-size: 18px; margin: 0 10px 0 0; }
.grow { flex: 1; }
.btn { appearance: none; border: 1px solid var(--lane); background: var(--panel); border-radius: 8px; padding: 6px 12px; min-height: 40px; cursor: pointer; font-size: 13.5px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--emph); border-color: var(--emph); color: #022c22; font-weight: 700; }
.btn.primary:disabled { opacity: .4; cursor: default; }
.btn.on { border-color: var(--accent); color: var(--accent); }
.btn.danger { color: var(--danger); }
select, input[type=text], input[type=number], textarea { background: var(--bg); border: 1px solid var(--lane); border-radius: 8px; padding: 7px 10px; }
input[type=number] { width: 100%; font-size: 13.5px; }
input[type=range] { width: 100%; accent-color: var(--emph); }
select { min-height: 40px; }
textarea { width: 100%; min-height: 80px; resize: vertical; line-height: 1.5; font-size: 13.5px; }
textarea.code { min-height: 320px; font-size: 13px; }
input[type=text] { width: 100%; font-size: 13.5px; }
.save-state { font-size: 13px; color: var(--muted); }
.save-state.dirty { color: var(--warn); font-weight: 700; }

.main { padding: 14px 20px 60px; }
.main.empty { padding-top: 40px; }
.main.empty p { max-width: 760px; }
.summary { color: var(--muted); margin: 0 0 10px; font-size: 14px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend i { width: 12px; height: 12px; border-radius: 3px; border: 2px solid var(--c); }
h2 { font-size: 17px; margin: 18px 0 4px; }
.note { color: var(--muted); font-size: 13.5px; margin: 0 0 10px; }

/* 일의 흐름 */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 8px; }
.work { appearance: none; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; }
.work:hover { border-color: var(--lane); }
.work.selected { border-color: var(--accent); }
.work .num { font-size: 12px; color: var(--faint); }
.work .name { font-size: 15px; font-weight: 700; line-height: 1.35; }
.work .desc { font-size: 13px; color: var(--muted); }
.who { display: flex; flex-wrap: wrap; gap: 5px; margin-top: auto; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); font-weight: 600; white-space: nowrap; }
.work.add { align-items: center; justify-content: center; color: var(--muted); border-style: dashed; min-height: 110px; }
.status { font-size: 11.5px; padding: 1px 8px; border-radius: 6px; font-weight: 700; align-self: flex-start; white-space: nowrap; border: 1px solid var(--lane); color: var(--muted); }
.st-ok { color: var(--emph); border-color: var(--emph); } .st-warn { color: var(--warn); border-color: var(--warn); } .st-none { border-style: dashed; }
.st-human { color: var(--human); border-color: var(--human); }

/* 캔버스 */
.stage { position: relative; overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); max-height: 76vh; }
.canvas { position: relative; }
.canvas.connecting .node { cursor: crosshair; }
.lane { position: absolute; left: 16px; right: 16px; border: 1px dashed var(--lane); border-radius: 10px; pointer-events: none; }
.lane span { position: absolute; left: 14px; top: 6px; color: var(--faint); font-size: 12px; }
.phase { position: absolute; top: 6px; font-size: 12px; color: var(--muted); pointer-events: none; }
svg.layer { position: absolute; left: 0; top: 0; overflow: visible; }
svg.wires { z-index: 0; pointer-events: none; }
svg.labels { z-index: 3; pointer-events: none; }
.wire { fill: none; stroke: var(--arrow); stroke-width: 1.6; transition: opacity .15s, stroke-width .15s; }
.wire.main { stroke: var(--emph); stroke-width: 2.2; }
.wire.loop { stroke: var(--agent); stroke-dasharray: 6 5; }
.wire.selected { stroke: var(--accent); stroke-width: 3; }
.wire-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: pointer; }
.wire-label { font: 11px var(--mono); fill: var(--muted); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; transition: opacity .15s; }
.node { position: absolute; z-index: 2; width: 172px; appearance: none; text-align: left; cursor: grab; padding: 9px 12px; border: 2px solid var(--c); border-radius: 10px; color: var(--text);
  background: color-mix(in srgb, var(--c) var(--tint), var(--bg)); display: flex; flex-direction: column; gap: 1px; user-select: none; touch-action: none; transition: opacity .15s, box-shadow .15s; }
.node .t { font-size: 10.5px; font-weight: 700; color: var(--c); text-transform: uppercase; letter-spacing: .05em; }
.node .n { font-size: 14.5px; font-weight: 700; line-height: 1.35; }
.node .s { font-size: 11.5px; color: var(--muted); }
.node .tag { position: absolute; right: -8px; top: -11px; font-size: 10.5px; background: var(--bg); border: 1px solid var(--c); color: var(--c); border-radius: 999px; padding: 0 7px; white-space: nowrap; }
.node.planned { border-style: dashed; }
.node.dragging { cursor: grabbing; box-shadow: 0 10px 28px rgba(0,0,0,.35); }
.node.selected { box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 35%, transparent); }
.node.source { outline: 3px solid var(--accent); outline-offset: 3px; }
.node:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
/* 마우스를 올리면 연결된 칸과 선만 남기고 흐리게 */
.canvas.hovering .node:not(.hl) { opacity: .22; }
.canvas.hovering .wire:not(.hl) { opacity: .12; }
.canvas.hovering .wire-label:not(.hl) { opacity: .15; }
.canvas.hovering .wire.hl { stroke-width: 2.6; }
.canvas.hovering .node.hl { box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.hint { font-size: 13px; color: var(--accent); min-height: 20px; margin: 0 0 6px; }

/* 오른쪽 패널 */
.panel { position: fixed; top: 0; right: 0; height: 100vh; width: min(640px, 100vw); background: var(--panel); border-left: 1px solid var(--lane); box-shadow: -12px 0 40px rgba(0,0,0,.35); z-index: 10; display: flex; flex-direction: column; transform: translateX(105%); transition: transform .2s; }
.panel.open { transform: none; }
.panel-head { padding: 16px 22px 0; display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.panel-head .k { font-size: 11px; font-weight: 700; color: var(--c, var(--muted)); text-transform: uppercase; letter-spacing: .06em; }
.panel-head h3 { margin: 2px 0 0; font-size: 20px; }
.close { appearance: none; border: 1px solid var(--lane); background: var(--bg); border-radius: 8px; width: 44px; height: 44px; font-size: 20px; cursor: pointer; }
.tabs { display: flex; gap: 2px; padding: 10px 22px 0; border-bottom: 1px solid var(--line); }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; font-weight: 700; color: var(--muted); cursor: pointer; font-size: 13.5px; }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--c, var(--accent)); }
.panel-body { padding: 16px 22px 48px; overflow-y: auto; flex: 1; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
.field label { font-size: 12px; color: var(--muted); font-weight: 600; }
.field .help { font-size: 12px; color: var(--faint); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
.checks label { display: inline-flex; gap: 6px; align-items: center; color: var(--text); font-weight: 500; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.panel-body h4 { font-size: 14.5px; margin: 20px 0 8px; }
code { font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px; }
pre { font-size: 12.5px; line-height: 1.55; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; max-height: 460px; white-space: pre-wrap; word-break: break-word; margin: 0; }
details { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; }
details > summary { cursor: pointer; padding: 10px 12px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "펼치기"; font-size: 12px; color: var(--faint); font-weight: 500; }
details[open] > summary::after { content: "접기"; }
details > .inner { padding: 0 12px 12px; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.stat { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 100px; }
.stat b { display: block; font-size: 16px; }
.stat span { font-size: 12px; color: var(--muted); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 7px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.empty { color: var(--muted); border: 1px dashed var(--lane); border-radius: 8px; padding: 14px; font-size: 13.5px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 8px; z-index: 20; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
/* 영상 기획 */
:root { --f0: #0e7490; --f1: #c2410c; --f2: #7c3aed; --f3: #15803d; --f4: #be185d; --f5: #a16207; }
#video { max-width: 1240px; }
.vnav { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin: 0 0 16px; }
.vnav button { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 12px; font-weight: 700; color: var(--muted); cursor: pointer; font-size: 13.5px; }
.vnav button:hover { color: var(--text); }
.vnav button[aria-selected="true"] { color: var(--text); border-color: var(--emph); }
.vnav .count { font-size: 11px; color: var(--emph); margin-left: 5px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 100%), 1fr)); gap: 10px; }
.card { appearance: none; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
button.card { cursor: pointer; }
.card:hover { border-color: var(--lane); }
.card.on { border-color: var(--emph); box-shadow: 0 0 0 1px var(--emph) inset; }
.card.avoid { border-color: var(--danger); }
.card .name { font-weight: 700; font-size: 14.5px; line-height: 1.35; }
.card .desc { font-size: 12.5px; color: var(--muted); }
.card .when { font-size: 12px; color: var(--faint); font-weight: 500; }
.card .pick { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
.mini { appearance: none; border: 1px solid var(--lane); background: var(--bg); border-radius: 6px; padding: 3px 10px; font-size: 12.5px; cursor: pointer; min-height: 32px; }
.mini:hover { border-color: var(--muted); }
.mini.on { border-color: var(--emph); color: var(--emph); font-weight: 700; }
.mini.no { border-color: var(--danger); color: var(--danger); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fmt { display: flex; gap: 8px; align-items: flex-end; height: 70px; }
.fmt i { border: 2px solid var(--emph); border-radius: 5px; background: color-mix(in srgb, var(--emph) var(--tint), transparent); }
.fmt-shorts i:first-child { width: 40px; height: 70px; } .fmt-long i:first-child { width: 112px; height: 63px; } .fmt-both i:first-child { width: 96px; height: 54px; }
.fmt-shorts i:last-child, .fmt-long i:last-child { display: none; } .fmt-both i:last-child { width: 32px; height: 56px; }
/* 스토리 그림 */
.diagram { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 10px 12px; }
.diagram svg { width: 100%; height: auto; display: block; }
.mini-svg svg { width: 100%; height: 56px; display: block; }
.sv-curve { fill: none; stroke: var(--emph); stroke-width: 2.5; }
.sv-area { fill: color-mix(in srgb, var(--emph) 12%, transparent); }
.sv-dot { fill: var(--bg); stroke: var(--emph); stroke-width: 2.5; }
.sv-name { font: 700 15px var(--mono); fill: var(--text); }
.sv-time { font: 12px var(--mono); fill: var(--muted); }
.sv-div { stroke: var(--lane); stroke-dasharray: 3 4; }
.sv-hook { fill: color-mix(in srgb, var(--warn) 14%, transparent); }
.sv-hook-t { font: 700 12px var(--mono); fill: var(--warn); }
.beats { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 8px; }
.beat { display: grid; grid-template-columns: 26px minmax(100px, 1fr) 78px 110px minmax(150px, 2.2fr) auto; gap: 8px; align-items: center; border-left: 4px solid var(--c); padding: 6px 8px; background: var(--panel); border-radius: 8px; }
.beat.head { background: none; border-left-color: transparent; font-size: 12px; color: var(--muted); padding-top: 0; padding-bottom: 0; }
.beat .bi { font-weight: 700; color: var(--c); }
.beat .bt { display: flex; gap: 4px; }
@media (max-width: 800px) { .beat { grid-template-columns: 26px 1fr 78px; } .beat > :nth-child(n+4) { grid-column: 2 / -1; } .beat.head { display: none; } }
/* 트랜지션 미리보기: A 화면 → B 화면 */
.tp, .cp .scr, .capv { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #000; }
.tp .f { position: absolute; inset: 0; display: grid; place-items: center; font-size: 30px; font-weight: 700; color: rgba(255,255,255,.75); }
.tp .fa { background: linear-gradient(135deg, var(--f0), #082f49); }
.tp .fb { background: linear-gradient(135deg, var(--f1), #431407); opacity: 0; }
.tp .o, .cp .o { position: absolute; width: 20%; aspect-ratio: 1; border-radius: 50%; left: 62%; top: 22%; background: rgba(255,255,255,.28); }
.tp .fb .o { background: rgba(253,230,138,.65); }
.tp .m { position: absolute; inset: 0; background: #0b1220; transform: translateX(-101%); }
.tp::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.tp .f, .tp .m, .tp::after { animation-duration: 2.8s; animation-iteration-count: infinite; animation-fill-mode: both; animation-timing-function: ease-in-out; }
.tp[data-a="cut"] .fb, .tp[data-a="flash"] .fb, .tp[data-a="match"] .fb, .tp[data-a="mask"] .fb { animation-name: t-cut; }
.tp[data-a="dissolve"] .fb { animation-name: t-in; }
.tp[data-a="fadeblack"] .fa { animation-name: t-fade-a; } .tp[data-a="fadeblack"] .fb { animation-name: t-fade-b; }
.tp[data-a="flash"]::after { animation-name: t-flash; }
.tp[data-a="whip"] .fa { animation-name: t-whip-a; } .tp[data-a="whip"] .fb { animation-name: t-whip-b; }
.tp[data-a="zoom"] .fa { animation-name: t-zoom-a; } .tp[data-a="zoom"] .fb { animation-name: t-zoom-b; }
.tp[data-a="push"] .fa { animation-name: t-push-a; } .tp[data-a="push"] .fb { animation-name: t-push-b; }
.tp[data-a="wipe"] .fb { animation-name: t-wipe; }
.tp[data-a="iris"] .fb { animation-name: t-iris; }
.tp[data-a="glitch"] .fa { animation-name: t-glitch-a; } .tp[data-a="glitch"] .fb { animation-name: t-glitch-b; }
.tp[data-a="spin"] .fa { animation-name: t-spin-a; } .tp[data-a="spin"] .fb { animation-name: t-spin-b; }
.tp[data-a="blur"] .fa { animation-name: t-blur-a; } .tp[data-a="blur"] .fb { animation-name: t-blur-b; }
.tp[data-a="mask"] .m { animation-name: t-mask; animation-timing-function: linear; }
.tp[data-a="match"] .o { width: 30%; left: 35%; top: 20%; }
@keyframes t-cut { 0%, 49.9% { opacity: 0 } 50%, 100% { opacity: 1 } }
@keyframes t-in { 0%, 35% { opacity: 0 } 65%, 100% { opacity: 1 } }
@keyframes t-fade-a { 0%, 30% { opacity: 1 } 48%, 100% { opacity: 0 } }
@keyframes t-fade-b { 0%, 52% { opacity: 0 } 70%, 100% { opacity: 1 } }
@keyframes t-flash { 0%, 46% { opacity: 0 } 50% { opacity: 1 } 68%, 100% { opacity: 0 } }
@keyframes t-whip-a { 0%, 40% { transform: none; filter: none } 52%, 100% { transform: translateX(-110%); filter: blur(8px) } }
@keyframes t-whip-b { 0%, 42% { opacity: 1; transform: translateX(110%); filter: blur(8px) } 54%, 100% { opacity: 1; transform: none; filter: none } }
@keyframes t-zoom-a { 0%, 40% { opacity: 1; transform: none; filter: none } 50% { opacity: 1; transform: scale(2.4); filter: blur(5px) } 50.1%, 100% { opacity: 0; transform: scale(2.4) } }
@keyframes t-zoom-b { 0%, 49.9% { opacity: 0; transform: scale(2); filter: blur(5px) } 50% { opacity: 1; transform: scale(2); filter: blur(5px) } 62%, 100% { opacity: 1; transform: none; filter: none } }
@keyframes t-push-a { 0%, 38% { transform: none } 60%, 100% { transform: translateX(-100%) } }
@keyframes t-push-b { 0%, 38% { opacity: 1; transform: translateX(100%) } 60%, 100% { opacity: 1; transform: none } }
@keyframes t-wipe { 0%, 38% { opacity: 1; clip-path: inset(0 100% 0 0) } 62%, 100% { opacity: 1; clip-path: inset(0 0 0 0) } }
@keyframes t-iris { 0%, 38% { opacity: 1; clip-path: circle(0% at 50% 50%) } 62%, 100% { opacity: 1; clip-path: circle(75% at 50% 50%) } }
@keyframes t-glitch-a { 0%, 42% { transform: none; filter: none } 44% { transform: translate(-6px, 2px); filter: hue-rotate(90deg) saturate(3) } 46% { transform: translate(5px, -3px) skewX(8deg); filter: none } 48% { transform: translate(-3px, 1px); filter: hue-rotate(-60deg) } 50%, 100% { transform: none; filter: none } }
@keyframes t-glitch-b { 0%, 49.9% { opacity: 0 } 50% { opacity: 1; transform: translate(6px, 0) skewX(-10deg); filter: hue-rotate(120deg) saturate(3) } 52% { transform: translate(-4px, 2px); filter: none } 54% { transform: translate(2px, -1px); filter: hue-rotate(-40deg) } 56%, 100% { opacity: 1; transform: none; filter: none } }
@keyframes t-spin-a { 0%, 38% { opacity: 1; transform: none } 50%, 100% { opacity: 0; transform: rotate(180deg) scale(.3) } }
@keyframes t-spin-b { 0%, 50% { opacity: 0; transform: rotate(-180deg) scale(.3) } 62%, 100% { opacity: 1; transform: none } }
@keyframes t-blur-a { 0%, 35% { filter: none } 65%, 100% { filter: blur(12px) } }
@keyframes t-blur-b { 0%, 35% { opacity: 0; filter: blur(12px) } 65%, 100% { opacity: 1; filter: none } }
@keyframes t-mask { 0%, 36% { transform: translateX(-101%) } 64%, 100% { transform: translateX(101%) } }
/* 컷 편집 미리보기: 화면 + 작은 타임라인 */
.cp .in { position: absolute; inset: 0; background: var(--c, var(--f0)); display: grid; place-items: center; }
.cp .lt { font-size: 20px; font-weight: 700; color: rgba(255,255,255,.8); }
.cp .snd { position: absolute; left: 8px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 0 6px; border-radius: 4px; }
.cp .snd:empty { display: none; }
.tl { margin-top: 8px; display: flex; flex-direction: column; gap: 3px; }
.trk { display: flex; align-items: center; gap: 6px; }
.trk .tn { width: 34px; font-size: 10.5px; color: var(--faint); flex: none; }
.clips { position: relative; flex: 1; display: flex; height: 18px; }
.clips b { height: 100%; background: var(--c); border-right: 1px solid var(--panel); font-size: 9.5px; color: rgba(255,255,255,.9); overflow: hidden; white-space: nowrap; padding-left: 3px; line-height: 18px; font-weight: 600; border-radius: 2px; }
.clips b.gap { background: transparent; }
.trk.au .clips { height: 13px; } .trk.au .clips b { background: color-mix(in srgb, var(--c) 50%, var(--panel)); line-height: 13px; }
.clips .ph { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); left: 0; }
/* 자막 미리보기 */
.capv { background: linear-gradient(160deg, #1e3a5f, #3f1d38); }
.capv.tall { width: 135px; height: 240px; aspect-ratio: auto; margin: 0 auto; }
.capv .cap { position: absolute; inset: 0; }
.capv .sub { position: absolute; left: 6%; right: 6%; bottom: 9%; text-align: center; font-size: 13px; font-weight: 700; color: #fff; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
.capv .top { position: absolute; left: 6%; right: 6%; top: 7%; text-align: center; font-size: 13px; font-weight: 700; color: #111; background: #fde047; padding: 2px 4px; border-radius: 4px; }
.capv.tall .sub, .capv.tall .top { font-size: 11px; }
.capv .pop, .capv .kw { position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 #000, 0 0 6px #000; animation: pop .25s ease-out; }
.capv .pop em { font-style: normal; color: #fde047; }
.capv .kw { color: #fde047; font-size: 24px; }
@keyframes pop { from { transform: scale(.6); opacity: 0 } 70% { transform: scale(1.08); opacity: 1 } to { transform: none } }
/* 배경음악: BPM 빠르기로 움직이는 막대 */
.eq { display: flex; gap: 4px; align-items: flex-end; height: 40px; }
.eq i { width: 8px; height: 100%; background: var(--emph); border-radius: 2px; transform-origin: bottom; animation: eq var(--beat, .5s) ease-in-out infinite; }
.eq i:nth-child(2) { animation-delay: calc(var(--beat, .5s) * -.35); } .eq i:nth-child(3) { animation-delay: calc(var(--beat, .5s) * -.7); }
.eq i:nth-child(4) { animation-delay: calc(var(--beat, .5s) * -.15); } .eq i:nth-child(5) { animation-delay: calc(var(--beat, .5s) * -.55); } .eq i:nth-child(6) { animation-delay: calc(var(--beat, .5s) * -.85); }
.eq.off i { animation: none; transform: scaleY(.12); background: var(--lane); }
@keyframes eq { 0%, 100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
@media (prefers-reduced-motion: reduce) { .tp:not(:hover) .f, .tp:not(:hover) .m, .tp:not(:hover)::after, .card:not(:hover) .eq i { animation-play-state: paused; } }
/* 레퍼런스 · 규칙 */
.ref { display: grid; grid-template-columns: 180px 1fr; gap: 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.ref .thumb { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; background: var(--bg) center / cover no-repeat; border: 1px solid var(--line); display: grid; place-items: center; color: var(--faint); font-size: 12px; text-decoration: none; }
.rule { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; margin-bottom: 6px; }
pre.brief { max-height: none; }
@media (max-width: 700px) { .ref { grid-template-columns: 1fr; } .rule { grid-template-columns: 1fr auto; } .rule select { grid-column: 1 / -1; } }
@media (max-width: 700px) { .apptabs { padding: 0 10px; overflow-x: auto; } .bar, .main { padding-left: 16px; padding-right: 16px; } .row2 { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="apptabs" role="tablist" aria-label="작업실 탭">
  <span class="brand" id="brand">flowboard</span>
  <button class="apptab" role="tab" data-view="dev">개발</button>
  <button class="apptab" role="tab" data-view="infra">인프라</button>
  <button class="apptab" role="tab" data-view="workflow">워크플로우</button>
  <button class="apptab" role="tab" data-view="video">영상</button>
  <button class="apptab" role="tab" data-view="claude">Claude</button>
  <span class="grow"></span>
  <button class="btn theme-btn" id="theme" aria-label="밝기 바꾸기">Light</button>
</nav>

<div class="bar">
  <h1 id="title"></h1>
  <select id="flow-select" aria-label="흐름 고르기"></select>
  <select id="run-select" aria-label="실행 기록 고르기"></select>
  <button class="btn" id="reload-runs">기록 새로 읽기</button>
  <button class="btn" id="add-node">+ 칸 추가</button>
  <button class="btn" id="connect">선 잇기</button>
  <button class="btn" id="add-video" hidden>+ 새 영상</button>
  <span class="grow"></span>
  <span class="save-state" id="save-state">저장됨</span>
  <button class="btn primary" id="save" disabled>저장</button>
</div>

<div class="main empty" id="empty" hidden></div>
<div class="main" id="content">
  <p class="summary" id="summary"></p>
  <div class="legend" id="legend"></div>
  <div id="work-section">
    <h2>일의 흐름</h2>
    <p class="note">무슨 일을 어떤 순서로 하는지. 카드를 누르면 고칠 수 있습니다.</p>
    <div class="flow" id="work"></div>
    <h2>구성</h2>
  </div>
  <p class="note">칸은 끌어서 옮기고, 누르면 설정이 열립니다. 마우스를 올리면 연결된 것만 보입니다. 선을 누르면 라벨을 고치거나 지웁니다.</p>
  <p class="hint" id="hint" aria-live="polite"></p>
  <div class="stage" id="stage">
    <div class="canvas" id="canvas">
      <svg class="layer wires" id="wires" aria-hidden="true"></svg>
      <svg class="layer labels" id="labels" aria-hidden="true"></svg>
    </div>
  </div>
</div>

<div class="main" id="video" hidden></div>

<aside class="panel" id="panel" aria-labelledby="p-name">
  <div class="panel-head">
    <div><div class="k" id="p-kind"></div><h3 id="p-name"></h3></div>
    <button class="close" id="p-close" aria-label="닫기">×</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="role">업무 내용</button>
    <button class="tab" role="tab" data-tab="run" id="tab-run">이번 배치 기록</button>
  </div>
  <div class="panel-body" id="p-body"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ── 어휘: 흐름마다 vocabulary 로 고릅니다 ─────────────────────── */
const VOCAB = {
  dev: { frontend: "frontend 화면", backend: "backend 처리", database: "database 데이터", cloud: "cloud 배포·호스팅", security: "security 검사·차단", messagebus: "messagebus 전달", external: "external 바깥" },
  actor: { human: "사람", script: "스크립트", agent: "AI 에이전트", service: "외부 서비스" },
};
const STATUSES = ["동작함", "고치는 중", "명령만 있음", "없음", "사람"];
const STATUS_CLASS = { "동작함": "st-ok", "고치는 중": "st-warn", "명령만 있음": "", "없음": "st-none", "사람": "st-human" };
const NODE_W = 172;

const state = { view: null, name: null, flow: null, runs: [], runId: null, run: null, dirty: false, flows: [], info: null,
  sel: null, tab: "role", connecting: false, source: null, claude: null,
  video: null, vname: null, brief: null, vsec: "basic", styleDirty: false };

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const lines = v => (v || []).join("\n");
const toList = text => text.split("\n").map(s => s.trim()).filter(Boolean);
const kinds = () => VOCAB[state.flow?.vocabulary] || VOCAB.actor;
const kindLabel = k => kinds()[k] || k;
const shortKind = k => state.flow?.vocabulary === "dev" ? k : kindLabel(k);

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2200); }
function setDirty(v = true) { state.dirty = v; $("#save").disabled = !v; $("#save-state").textContent = v ? "저장 안 된 변경 있음" : "저장됨"; $("#save-state").classList.toggle("dirty", v); }
function hint(msg) { $("#hint").textContent = msg || ""; }

/* ── 밝기 ──────────────────────────────────────────────────────── */
function applyTheme(t) { document.documentElement.dataset.theme = t; $("#theme").textContent = t === "dark" ? "Light" : "Dark"; try { localStorage.setItem("theme", t); } catch {} }
let savedTheme = "dark"; try { savedTheme = localStorage.getItem("theme") || "dark"; } catch {}
applyTheme(savedTheme);
$("#theme").addEventListener("click", () => applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* ── 탭 · 불러오기 · 저장 ──────────────────────────────────────── */
const TABS = ["dev", "infra", "workflow", "claude"];
const flowsOf = view => state.flows.filter(f => f.tab === view);
async function showView(view, flowName) {
  if (view === "video") return showVideo(flowName);
  if (state.view === "video") {
    if (state.dirty && !confirm("저장 안 된 변경이 있습니다. 버리고 이동할까요?")) { history.replaceState(null, "", "#video"); return; }
    setDirty(false); Object.assign(state, { view: null, name: null, brief: null, styleDirty: false });
    $("#video").hidden = true; $("#add-video").hidden = true;
  }
  if (!TABS.includes(view)) view = state.flows.length ? (state.flows.find(f => f.tab === "workflow") || state.flows[0]).tab : "workflow";
  const list = flowsOf(view);
  const want = flowName || (list.some(f => f.name === state.name) && view === state.view ? state.name : list[0]?.name) || null;
  if (state.dirty && want !== state.name && !confirm("저장 안 된 변경이 있습니다. 버리고 이동할까요?")) { history.replaceState(null, "", "#" + state.view); return; }
  state.view = view;
  document.querySelectorAll(".apptab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === view));
  $("#flow-select").innerHTML = list.map(f => `<option value="${esc(f.name)}"${f.name === want ? " selected" : ""}>${esc(f.title)}</option>`).join("");
  $("#flow-select").hidden = list.length < 2;
  if (location.hash !== "#" + view) history.replaceState(null, "", "#" + view);
  closePanel();
  if (view === "claude" && !state.claude) state.claude = await api("/api/claude").catch(() => null);
  if (!want) return showEmpty(view);
  $("#empty").hidden = true; $("#content").hidden = false;
  if (want !== state.name) await loadFlow(want); else renderAll();
}
function showEmpty(view) {
  Object.assign(state, { name: null, flow: null, sel: null });
  $("#content").hidden = true; $("#empty").hidden = false;
  for (const id of ["#run-select", "#reload-runs", "#add-node", "#connect", "#save", "#save-state"]) $(id).hidden = true;
  $("#title").textContent = { dev: "개발", infra: "인프라", workflow: "워크플로우", claude: "Claude" }[view];
  $("#empty").innerHTML = `<p>이 프로젝트에는 <b>${esc(view)}</b> 탭 흐름이 없습니다.</p>
    <p class="note"><code>${esc(state.info.flowsDir)}/&lt;이름&gt;/flow.json</code>에 <code>"tab": "${esc(view)}"</code>를 적은 흐름을 두면 이 탭에 나옵니다.
    기본 흐름이 필요하면 터미널에서 <code>flowboard init ${esc(state.info.root)}</code></p>`;
}
async function loadFlows() {
  state.info = await api("/api/info");
  state.flows = state.info.flows;
  $("#brand").textContent = state.info.project;
  document.title = `${state.info.project} · flowboard`;
}
async function loadFlow(name) {
  const data = await api(`/api/flow?name=${encodeURIComponent(name)}`);
  Object.assign(state, { name, flow: data.flow, runs: data.runs, sel: null, run: null, runId: null });
  for (const k of ["work", "phases", "lanes", "nodes", "edges"]) state.flow[k] ??= [];
  $("#title").textContent = state.flow.title || name;
  $("#summary").textContent = state.flow.summary || "";
  for (const id of ["#add-node", "#connect", "#save", "#save-state"]) $(id).hidden = false;
  for (const id of ["#run-select", "#reload-runs"]) $(id).hidden = !state.runs.length;
  renderLegend(); renderRuns(); setDirty(false); renderAll();
  if (state.runs.length) await loadRun(state.runs[0].id);
}
function renderLegend() {
  $("#legend").innerHTML = Object.entries(kinds()).map(([k, t]) => `<span style="--c:var(--${k})"><i></i>${esc(t)}</span>`).join("")
    + `<span style="--c:var(--emph)"><i style="border-radius:0;height:0;border-width:1px 0 1px"></i>주 경로</span>`;
}
function renderRuns() {
  const fmt = t => new Date(t * 1000).toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  $("#run-select").innerHTML = state.runs.length ? state.runs.map(r => `<option value="${esc(r.id)}">${esc(r.id)} · ${fmt(r.mtime)}</option>`).join("") : `<option value="">실행 기록 없음</option>`;
}
async function loadRun(id) {
  state.runId = id || null;
  state.run = id ? await api(`/api/run?name=${encodeURIComponent(state.name)}&id=${encodeURIComponent(id)}`) : null;
  if (state.sel && state.tab === "run") renderPanel();
}
async function save() {
  if (state.view === "video") return saveVideo();
  try { await api(`/api/flow?name=${encodeURIComponent(state.name)}`, { method: "PUT", body: JSON.stringify(state.flow) }); setDirty(false); toast("flow.json 저장됨"); }
  catch (e) { toast("저장 실패: " + e.message); }
}

/* ── 일의 흐름 ─────────────────────────────────────────────────── */
function renderWork() {
  const show = state.flow.work.length > 0 || state.view === "workflow";
  $("#work-section").hidden = !show;
  if (!show) return;
  const items = state.flow.work.map((w, i) => `
    <button class="work${state.sel?.type === "work" && state.sel.index === i ? " selected" : ""}" data-index="${i}">
      <span class="num">${String(i + 1).padStart(2, "0")}</span>
      <span class="name">${esc(w.name)}</span>
      <span class="status ${STATUS_CLASS[w.status] ?? ""}">${esc(w.status)}</span>
      <span class="desc">${esc(w.desc)}</span>
      <span class="who">${(w.who || []).map(k => `<span class="chip" style="--c:var(--${k})">${esc(VOCAB.actor[k] || k)}</span>`).join("")}</span>
    </button>`).join("");
  $("#work").innerHTML = items + `<button class="work add" id="add-work">+ 일 추가</button>`;
  $("#work").querySelectorAll(".work[data-index]").forEach(el => el.addEventListener("click", () => select({ type: "work", index: +el.dataset.index })));
  $("#add-work").addEventListener("click", () => { state.flow.work.push({ name: "새 일", desc: "", who: [], status: "없음" }); setDirty(); select({ type: "work", index: state.flow.work.length - 1 }); });
}

/* ── 캔버스 ────────────────────────────────────────────────────── */
const nodeById = id => state.flow.nodes.find(n => n.id === id);
function renderCanvas() {
  const canvas = $("#canvas");
  canvas.querySelectorAll(".node, .phase, .lane").forEach(el => el.remove());
  canvas.classList.toggle("connecting", state.connecting);
  for (const l of state.flow.lanes) canvas.insertAdjacentHTML("afterbegin", `<div class="lane" style="top:${l.y}px;height:${l.h}px"><span>${esc(l.label)}</span></div>`);
  for (const p of state.flow.phases) canvas.insertAdjacentHTML("beforeend", `<div class="phase" style="left:${p.x}px">${esc(p.label)}</div>`);
  for (const n of state.flow.nodes) {
    const el = document.createElement("button");
    el.className = `node${n.status === "없음" ? " planned" : ""}${state.sel?.type === "node" && state.sel.id === n.id ? " selected" : ""}${state.source === n.id ? " source" : ""}`;
    el.id = "n-" + n.id; el.dataset.id = n.id;
    el.style.cssText = `left:${n.x}px;top:${n.y}px;--c:var(--${n.kind})`;
    el.innerHTML = `<span class="t">${esc(shortKind(n.kind))}${n.status && n.status !== "동작함" ? " · " + esc(n.status) : ""}</span><span class="n">${esc(n.name)}</span><span class="s">${esc(n.meta)}</span>${n.tag ? `<span class="tag">${esc(n.tag)}</span>` : ""}`;
    attachNode(el, n);
    canvas.appendChild(el);
  }
  sizeCanvas(); drawWires();
}
function sizeCanvas() {
  const w = Math.max(...state.flow.nodes.map(n => n.x + NODE_W), ...state.flow.phases.map(p => p.x + 200), 900) + 80;
  const h = Math.max(...state.flow.nodes.map(n => n.y + 110), ...state.flow.lanes.map(l => l.y + l.h), 300) + 40;
  const c = $("#canvas"); c.style.width = w + "px"; c.style.height = h + "px";
  for (const s of ["#wires", "#labels"]) { $(s).setAttribute("width", w); $(s).setAttribute("height", h); }
}
function box(id) {
  const el = $("#n-" + CSS.escape(id)); const n = nodeById(id);
  const w = el.offsetWidth, h = el.offsetHeight;
  return { l: n.x, r: n.x + w, t: n.y, b: n.y + h, cx: n.x + w / 2, cy: n.y + h / 2 };
}
// 둥근 모서리 꺾은선 — 가로로 나가 x에서 꺾여 세로로, 다시 가로로 들어갑니다.
function elbow(x1, y1, x2, y2, x) {
  if (Math.abs(y1 - y2) < 4) return `M${x1},${y1} L${x2},${y1}`;
  const dy = Math.sign(y2 - y1), s1 = Math.sign(x - x1) || 1, s2 = Math.sign(x2 - x) || 1;
  const r = Math.min(10, Math.abs(y2 - y1) / 2, Math.abs(x - x1), Math.abs(x2 - x));
  return `M${x1},${y1} L${x - r * s1},${y1} Q${x},${y1} ${x},${y1 + r * dy} L${x},${y2 - r * dy} Q${x},${y2} ${x + r * s2},${y2} L${x2},${y2}`;
}
function elbowV(x1, y1, x2, y2, y) {
  if (Math.abs(x1 - x2) < 4) return `M${x1},${y1} L${x1},${y2}`;
  const dx = Math.sign(x2 - x1), s1 = Math.sign(y - y1) || 1, s2 = Math.sign(y2 - y) || 1;
  const r = Math.min(10, Math.abs(x2 - x1) / 2, Math.abs(y - y1), Math.abs(y2 - y));
  return `M${x1},${y1} L${x1},${y - r * s1} Q${x1},${y} ${x1 + r * dx},${y} L${x2 - r * dx},${y} Q${x2},${y} ${x2},${y + r * s2} L${x2},${y2}`;
}
function drawWires() {
  let wires = "", labels = "";
  state.flow.edges.forEach((e, i) => {
    if (!nodeById(e.from) || !nodeById(e.to)) return;
    const a = box(e.from), b = box(e.to);
    let d, lx, ly, anchor = "middle";
    if (e.kind === "loop") {
      const x = Math.min(a.l, b.l) - 22; d = elbow(a.l, a.cy, b.l, b.cy, x); lx = x - 6; ly = (a.cy + b.cy) / 2 + 4; anchor = "end";
    } else if (b.l >= a.r + 16 || b.r <= a.l - 16) {
      const right = b.l >= a.r + 16, x1 = right ? a.r : a.l, x2 = right ? b.l : b.r, x = (x1 + x2) / 2;
      d = elbow(x1, a.cy, x2, b.cy, x); lx = x; ly = Math.abs(a.cy - b.cy) < 4 ? a.cy - 8 : (a.cy + b.cy) / 2 + 4;
    } else {
      const down = b.cy > a.cy, y1 = down ? a.b : a.t, y2 = down ? b.t : b.b, y = (y1 + y2) / 2;
      d = elbowV(a.cx, y1, b.cx, y2, y); lx = (a.cx + b.cx) / 2 + 10; ly = y + 4; anchor = "start";
    }
    const sel = state.sel?.type === "edge" && state.sel.index === i;
    const cls = `wire${e.kind === "main" ? " main" : ""}${e.kind === "loop" ? " loop" : ""}${sel ? " selected" : ""}`;
    const marker = sel ? "arrow-sel" : e.kind === "main" ? "arrow-main" : e.kind === "loop" ? "arrow-loop" : "arrow";

/* ── 기획서(brief.md): 사람과 Claude가 읽는 글 ───────────────────── */
function briefMarkdown(b, name) {
  const L = [], add = (...x) => L.push(...x), cell = s => String(s ?? "").replace(/\|/g, "\\|").replace(/\n/g, " ");
  add(`# ${b.title || name}`, "");
  if (b.logline) add(`> ${b.logline}`, "");
  add(`- 형식: ${FORMATS[b.format]?.name || "정하지 않음"} · ${b.ratio || "-"} · ${clock(b.duration)}`);
  if (b.platforms.length) add(`- 올릴 곳: ${b.platforms.join(", ")}`);
  if (b.target) add(`- 보는 사람: ${b.target}`);
  const beats = b.story.beats;
  if (beats.length) {
    add("", `## 스토리 — ${STORIES[b.story.template]?.name || "직접 구성"}`, "", "| # | 구간 | 시간 | 무엇을 보여 주나 | 긴장도 |", "|---|---|---|---|---|");
    let t = 0;
    beats.forEach((x, i) => { const s = t; t += +x.sec || 0; add(`| ${i + 1} | ${cell(x.name)} | ${clock(s)}–${clock(t)} | ${cell(x.desc)} | ${"▮".repeat(Math.round((x.tension ?? .5) * 5)) || "·"} |`); });
  }
  const c = b.cut;
  if (c.styles.length || c.notes) { add("", "## 컷 편집", ""); c.styles.forEach(k => CUTS[k] && add(`- **${CUTS[k].name}** — ${CUTS[k].desc}`)); if (c.notes) add("", c.notes); }
  const tr = b.transitions;
  if (tr.use.length || tr.avoid.length || tr.notes) {
    add("", "## 트랜지션", "");
    if (tr.use.length) add(`- 쓴다: ${tr.use.map(k => TRANS[k] ? `${TRANS[k].name}(${TRANS[k].dur})` : k).join(", ")}`, "- 그 밖의 트랜지션은 먼저 물어보고 쓴다.");
    if (tr.avoid.length) add(`- 쓰지 않는다: ${tr.avoid.map(k => TRANS[k]?.name || k).join(", ")}`);
    if (tr.notes) add("", tr.notes);
  }
  const cap = CAPS[b.captions.style];
  if (cap || b.captions.notes) { add("", "## 자막", ""); if (cap) add(`- **${cap.name}** — ${cap.desc}`); if (b.captions.notes) add("", b.captions.notes); }
  const m = b.music, mood = MOODS[m.mood];
  if (mood || m.bpm || m.genre || m.source || m.refs || m.volume || m.notes) {
    add("", "## 배경음악", "");
    if (mood) add(`- 분위기: **${mood.name}** — ${mood.desc}`);
    if (m.bpm) add(`- BPM: ${m.bpm}`);
    [["장르 · 악기", m.genre], ["출처", m.source], ["레퍼런스 곡", m.refs], ["볼륨", m.volume]].forEach(([k, v]) => v && add(`- ${k}: ${v}`));
    if (m.notes) add("", m.notes);
  }
  const t = b.tools, ed = EDITORS[t.editor], picks = TOOL_GROUPS.filter(([g]) => t.picks[g]?.length);
  if (ed || picks.length || t.notes) {
    add("", "## 도구", "");
    if (ed) add(`- 편집 프로그램: **${ed.name}**`, `- Claude가 넘길 것: ${ed.handoff}`);
    picks.forEach(([g, label]) => add(`- ${label}: ${t.picks[g].join(", ")}`));
    if (t.notes) add("", t.notes);
  }
  if (b.references.length) {
    add("", "## 레퍼런스", "");
    b.references.forEach(r => add(`- ${r.title || r.url || "(이름 없음)"}${r.url && r.title ? ` — ${r.url}` : ""}${r.at ? ` · 구간 ${r.at}` : ""}${r.take?.length ? ` · 가져올 것: ${r.take.join(", ")}` : ""}${r.memo ? `\n  - ${r.memo}` : ""}`));
  }
  const rules = (state.video?.style.rules || []).filter(r => r.text?.trim());
  if (rules.length) { add("", "## 늘 지키는 것 (채널 규칙)", ""); rules.forEach(r => add(`- [${r.area}] ${r.text.trim()}`)); }
  if (b.notes) add("", "## 이번 영상 메모", "", b.notes);
  return L.join("\n") + "\n";
}

/* ── 이벤트 ────────────────────────────────────────────────────── */
document.querySelectorAll(".apptab").forEach(t => t.addEventListener("click", () => showView(t.dataset.view)));
window.addEventListener("hashchange", () => showView(location.hash.slice(1)));
$("#flow-select").addEventListener("change", e => showView(state.view, e.target.value));
$("#run-select").addEventListener("change", e => loadRun(e.target.value));
$("#reload-runs").addEventListener("click", async () => {
  const data = await api(`/api/flow?name=${encodeURIComponent(state.name)}`); state.runs = data.runs; renderRuns();
  if (state.runs.length) { $("#run-select").value = state.runs[0].id; await loadRun(state.runs[0].id); }
  toast("실행 기록을 다시 읽었습니다");
});
$("#save").addEventListener("click", save);
$("#add-node").addEventListener("click", addNode);
$("#add-video").addEventListener("click", newVideo);
$("#connect").addEventListener("click", () => state.connecting ? stopConnecting() : startConnecting());
$("#p-close").addEventListener("click", closePanel);
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { state.tab = t.dataset.tab; renderPanel(); }));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (state.connecting) stopConnecting(); else closePanel(); }
  if ((e.metaKey || e.ctrlKey) && e.key === "s") { e.preventDefault(); if (state.dirty) save(); }
});
window.addEventListener("beforeunload", e => { if (state.dirty) { e.preventDefault(); e.returnValue = ""; } });
loadFlows().then(() => showView(location.hash.slice(1))).catch(e => document.body.insertAdjacentHTML("afterbegin", `<p class="empty" style="margin:16px">불러오기 실패: ${esc(e.message)}</p>`));
</script>
</body>
</html>
